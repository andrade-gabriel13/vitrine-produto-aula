<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Nível Up Games — Vitrine de Produtos</title>
    <script>
      // Aplica o tema salvo antes de desenhar a página, para não piscar
      // no tema claro quando a escolha for o escuro.
      (function () {
        try {
          var salvo = localStorage.getItem('vitrine:tema')
          var escuro =
            salvo === 'escuro' ||
            (!salvo && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro'
        } catch (e) {
          document.documentElement.dataset.tema = 'claro'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
